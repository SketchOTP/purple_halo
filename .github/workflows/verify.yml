name: Verify Purple Halo

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest -q
      - run: bash scripts/verify-loop.sh
      - run: bash scripts/verify.sh
